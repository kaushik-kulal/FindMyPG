<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage PGs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
     background-image: url('pgimg.jpg');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
     /*  color: #212529; Dark text for readability */
      transition: background 0.3s, color 0.3s;
    }

    .dark-mode {
      background-color: #1a1a2e !important;
      background-image: none !important;
      color: #f1f1f1;
    }

    .container {
      max-width: 600px;
      margin-top: 50px;
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .dark-mode .container {
      background-color: rgba(30, 30, 30, 0.95);
      color: white;
    }

    .btn {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">Add New PG</h2>
    <form id="pgForm" role="form">
      <div class="mb-3">
        <label for="pgName" class="form-label">PG Name</label>
        <input type="text" id="pgName" name="pgName" class="form-control" required aria-required="true">
      </div>
      <div class="mb-3">
        <label for="pgLocation" class="form-label">Location</label>
        <input type="text" id="pgLocation" name="pgLocation" class="form-control" required aria-required="true">
      </div>
      <div class="mb-3">
        <label for="pgRent" class="form-label">Rent (₹)</label>
        <input type="number" id="pgRent" name="pgRent" class="form-control" required aria-required="true">
      </div>
      <button type="submit" class="btn btn-primary w-100">Add PG</button>
    </form>

    <a href="admin_dashboard.html" class="btn btn-success w-100 mt-3">Go to Dashboard</a>
  </div>

  <script>
    const form = document.getElementById('pgForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('pgName').value;
      const location = document.getElementById('pgLocation').value;
      const rent = document.getElementById('pgRent').value;

      const newPG = { name, location, rent };

      let pgList = JSON.parse(localStorage.getItem('pgList')) || [];
      pgList.push(newPG);
      localStorage.setItem('pgList', JSON.stringify(pgList));

      alert('✅ PG added successfully!');
      form.reset();
    });

    window.onload = function () {
      const darkMode = localStorage.getItem('darkMode') === 'true';
      if (darkMode) {
        document.body.classList.add('dark-mode');
      }
    };
  </script>
</body>
</html>
