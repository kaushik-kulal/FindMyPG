<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Bookings - FindMyPG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            height: 50px;
            width: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .back-btn, .logout-btn {
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem 2rem;
        }

        .page-header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: slideDown 0.5s ease;
        }

        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .page-header p {
            font-size: 1.1rem;
            color: #666;
        }

        .filter-section {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-section label {
            font-weight: 600;
            color: #333;
        }

        .filter-section select {
            padding: 0.7rem 1rem;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-section select:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .stat-box h3 {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .stat-box p {
            color: #666;
            font-size: 0.95rem;
        }

        .bookings-grid {
            display: grid;
            gap: 1.5rem;
        }

        .booking-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
            border-left: 5px solid #667eea;
        }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .booking-title {
            flex: 1;
        }

        .booking-title h3 {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 0.3rem;
        }

        .booking-id {
            font-size: 0.85rem;
            color: #999;
            font-family: monospace;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-confirmed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #666;
            font-size: 0.95rem;
        }

        .detail-item i {
            color: #667eea;
            width: 20px;
        }

        .detail-item strong {
            color: #333;
        }

        .booking-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid #f3f4f6;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .empty-state i {
            font-size: 5rem;
            color: #667eea;
            opacity: 0.3;
            margin-bottom: 1.5rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #666;
            font-size: 1.1rem;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem 1rem;
            }

            .page-header {
                padding: 1.5rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

            .booking-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-section select {
                width: 100%;
            }

            .header-actions {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-section">
                <div class="logo">FM</div>
                <div class="logo-text">FindMyPG</div>
            </div>
            
            <div class="header-actions">
                <a href="owner_dashboard.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i> Dashboard
                </a>
                <a href="login.html" class="logout-btn">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fa-solid fa-calendar-check"></i> Booking Management</h1>
            <p>View and manage all your PG bookings</p>
        </div>

        <div class="stats-summary">
            <div class="stat-box">
                <h3 id="totalBookingsCount">0</h3>
                <p>Total Bookings</p>
            </div>
            <div class="stat-box">
                <h3 id="pendingCount">0</h3>
                <p>Pending</p>
            </div>
            <div class="stat-box">
                <h3 id="confirmedCount">0</h3>
                <p>Confirmed</p>
            </div>
            <div class="stat-box">
                <h3 id="cancelledCount">0</h3>
                <p>Cancelled</p>
            </div>
        </div>

        <div class="filter-section">
            <label for="statusFilter">Filter by Status:</label>
            <select id="statusFilter">
                <option value="all">All Bookings</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="cancelled">Cancelled</option>
            </select>

            <label for="sortBy">Sort by:</label>
            <select id="sortBy">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="price-high">Price (High to Low)</option>
                <option value="price-low">Price (Low to High)</option>
            </select>
        </div>

        <div class="bookings-grid" id="bookingsContainer">
            <!-- Bookings will be loaded here -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Check if user is logged in
            const currentUser = JSON.parse(localStorage.getItem("currentUser") || "{}");
            if (!currentUser || !currentUser.name) {
                alert("Please login first!");
                window.location.href = "login.html";
                return;
            }

            // Load bookings from localStorage
            let allBookings = JSON.parse(localStorage.getItem("pgBookings") || "[]");
            
            // If no bookings exist, create some sample data for demonstration
            if (allBookings.length === 0) {
                allBookings = [
                    {
                        id: "BK001",
                        pgName: "Sunshine PG",
                        userName: "Rahul Kumar",
                        userEmail: "rahul@example.com",
                        userPhone: "+91 98765 43210",
                        checkIn: "2025-11-01",
                        checkOut: "2025-12-01",
                        duration: "1 Month",
                        rent: 8500,
                        city: "Delhi",
                        address: "Sector 15, Rohini",
                        status: "pending",
                        bookingDate: "2025-10-25",
                        specialRequests: "Need parking space"
                    },
                    {
                        id: "BK002",
                        pgName: "Green Valley PG",
                        userName: "Priya Sharma",
                        userEmail: "priya@example.com",
                        userPhone: "+91 98765 43211",
                        checkIn: "2025-11-05",
                        checkOut: "2025-12-05",
                        duration: "1 Month",
                        rent: 9500,
                        city: "Delhi",
                        address: "Dwarka Sector 10",
                        status: "confirmed",
                        bookingDate: "2025-10-20",
                        specialRequests: "Vegetarian meals only"
                    },
                    {
                        id: "BK003",
                        pgName: "Elite Residence",
                        userName: "Amit Patel",
                        userEmail: "amit@example.com",
                        userPhone: "+91 98765 43212",
                        checkIn: "2025-10-28",
                        checkOut: "2025-11-28",
                        duration: "1 Month",
                        rent: 12000,
                        city: "Delhi",
                        address: "South Extension Part 1",
                        status: "confirmed",
                        bookingDate: "2025-10-18",
                        specialRequests: "None"
                    }
                ];
                localStorage.setItem("pgBookings", JSON.stringify(allBookings));
            }

            function updateStats(bookings) {
                document.getElementById("totalBookingsCount").textContent = bookings.length;
                document.getElementById("pendingCount").textContent = bookings.filter(b => b.status === "pending").length;
                document.getElementById("confirmedCount").textContent = bookings.filter(b => b.status === "confirmed").length;
                document.getElementById("cancelledCount").textContent = bookings.filter(b => b.status === "cancelled").length;
            }

            function renderBookings(bookings) {
                const container = document.getElementById("bookingsContainer");
                
                if (bookings.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-calendar-xmark"></i>
                            <h3>No Bookings Found</h3>
                            <p>There are no bookings matching your filters</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = bookings.map(booking => `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div class="booking-title">
                                <h3>${booking.pgName}</h3>
                                <div class="booking-id">Booking ID: ${booking.id}</div>
                            </div>
                            <span class="status-badge status-${booking.status}">
                                ${booking.status}
                            </span>
                        </div>

                        <div class="booking-details">
                            <div class="detail-group">
                                <div class="detail-item">
                                    <i class="fa-solid fa-user"></i>
                                    <span><strong>Guest:</strong> ${booking.userName}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-solid fa-envelope"></i>
                                    <span>${booking.userEmail}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-solid fa-phone"></i>
                                    <span>${booking.userPhone}</span>
                                </div>
                            </div>

                            <div class="detail-group">
                                <div class="detail-item">
                                    <i class="fa-solid fa-calendar-plus"></i>
                                    <span><strong>Check-in:</strong> ${booking.checkIn}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-solid fa-calendar-minus"></i>
                                    <span><strong>Check-out:</strong> ${booking.checkOut}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-solid fa-clock"></i>
                                    <span><strong>Duration:</strong> ${booking.duration}</span>
                                </div>
                            </div>

                            <div class="detail-group">
                                <div class="detail-item">
                                    <i class="fa-solid fa-location-dot"></i>
                                    <span>${booking.address}, ${booking.city}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-solid fa-indian-rupee-sign"></i>
                                    <span><strong>Rent:</strong> ₹${booking.rent}/month</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-solid fa-calendar"></i>
                                    <span><strong>Booked on:</strong> ${booking.bookingDate}</span>
                                </div>
                            </div>
                        </div>

                        ${booking.specialRequests && booking.specialRequests !== "None" ? `
                            <div class="detail-item" style="margin-top: 1rem; padding: 1rem; background: #f3f4f6; border-radius: 10px;">
                                <i class="fa-solid fa-message"></i>
                                <span><strong>Special Requests:</strong> ${booking.specialRequests}</span>
                            </div>
                        ` : ''}

                        <div class="booking-actions">
                            ${booking.status === "pending" ? `
                                <button class="btn btn-success" onclick="updateBookingStatus('${booking.id}', 'confirmed')">
                                    <i class="fa-solid fa-check"></i> Confirm Booking
                                </button>
                                <button class="btn btn-danger" onclick="updateBookingStatus('${booking.id}', 'cancelled')">
                                    <i class="fa-solid fa-times"></i> Reject
                                </button>
                            ` : ''}
                            ${booking.status === "confirmed" ? `
                                <button class="btn btn-primary" onclick="contactGuest('${booking.userPhone}')">
                                    <i class="fa-solid fa-phone"></i> Contact Guest
                                </button>
                                <button class="btn btn-danger" onclick="updateBookingStatus('${booking.id}', 'cancelled')">
                                    <i class="fa-solid fa-ban"></i> Cancel Booking
                                </button>
                            ` : ''}
                            ${booking.status === "cancelled" ? `
                                <button class="btn btn-danger" onclick="deleteBooking('${booking.id}')">
                                    <i class="fa-solid fa-trash"></i> Delete Record
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `).join("");
            }

            function filterAndSortBookings() {
                const statusFilter = document.getElementById("statusFilter").value;
                const sortBy = document.getElementById("sortBy").value;

                let filtered = [...allBookings];

                // Filter by status
                if (statusFilter !== "all") {
                    filtered = filtered.filter(b => b.status === statusFilter);
                }

                // Sort bookings
                switch(sortBy) {
                    case "newest":
                        filtered.sort((a, b) => new Date(b.bookingDate) - new Date(a.bookingDate));
                        break;
                    case "oldest":
                        filtered.sort((a, b) => new Date(a.bookingDate) - new Date(b.bookingDate));
                        break;
                    case "price-high":
                        filtered.sort((a, b) => b.rent - a.rent);
                        break;
                    case "price-low":
                        filtered.sort((a, b) => a.rent - b.rent);
                        break;
                }

                renderBookings(filtered);
            }

            // Global functions for button actions
            window.updateBookingStatus = function(bookingId, newStatus) {
                const bookingIndex = allBookings.findIndex(b => b.id === bookingId);
                if (bookingIndex !== -1) {
                    allBookings[bookingIndex].status = newStatus;
                    localStorage.setItem("pgBookings", JSON.stringify(allBookings));
                    
                    const statusText = newStatus === "confirmed" ? "confirmed" : "cancelled";
                    alert(`Booking ${bookingId} has been ${statusText}!`);
                    
                    updateStats(allBookings);
                    filterAndSortBookings();
                }
            };

            window.contactGuest = function(phone) {
                alert(`Contacting guest at ${phone}\n\nYou can call them directly or send a message.`);
            };

            window.deleteBooking = function(bookingId) {
                if (confirm("Are you sure you want to delete this booking record?")) {
                    allBookings = allBookings.filter(b => b.id !== bookingId);
                    localStorage.setItem("pgBookings", JSON.stringify(allBookings));
                    
                    alert("Booking record deleted successfully!");
                    
                    updateStats(allBookings);
                    filterAndSortBookings();
                }
            };

            // Event listeners for filters
            document.getElementById("statusFilter").addEventListener("change", filterAndSortBookings);
            document.getElementById("sortBy").addEventListener("change", filterAndSortBookings);

            // Initial render
            updateStats(allBookings);
            filterAndSortBookings();
        });
    </script>
    <div id="footer"></div>
<script>
  // Load the footer dynamically
  fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    })
    .catch(err => console.error("Error loading footer:", err));
</script>
</body>
</html>
