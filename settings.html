<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings - PG Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f6f9;
      color: #212529;
    }
    .sidebar {
      height: 100vh;
      background-color: #1a1a2e;
      color: white;
      position: fixed;
      width: 240px;
      padding-top: 20px;
    }
    .sidebar a {
      display: block;
      color: #ccc;
      padding: 12px 20px;
      text-decoration: none;
    }
    .sidebar a:hover, .sidebar a.active {
      background-color: #16213e;
      color: #fff;
    }
    .main-content {
      margin-left: 240px;
      padding: 20px;
    }
    .form-label {
      font-weight: 500;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
    }
    .btn-delete:hover {
      background-color: #b02a37;
    }
  </style>
</head>
<body>
  <nav class="sidebar">
    <h3 class="text-center">PG Admin</h3>
    <a href="index.html">Dashboard</a>
    <a href="manage_pg.html">Manage PGs</a>
    <a href="bookings.html">Bookings</a>
    <a href="messages.html">Messages</a>
    <a href="settings.html" class="active">Settings</a>
    <a href="logout.html">Logout</a>
  </nav>

  <main class="main-content">
    <h2 class="mb-4">Settings</h2>

    <!-- Dark Mode Toggle -->
    <section class="mb-4">
      <h4>Appearance</h4>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="darkModeToggle" aria-label="Toggle dark mode">
        <label class="form-check-label" for="darkModeToggle">Enable Dark Mode</label>
      </div>
    </section>

    <!-- Admin Profile -->
    <section class="mb-4">
      <h4>Admin Profile</h4>
      <form id="profileForm">
        <div class="mb-3">
          <label for="adminName" class="form-label">Name</label>
          <input type="text" id="adminName" class="form-control" value="priya" required />
        </div>
        <div class="mb-3">
          <label for="adminEmail" class="form-label">Email</label>
          <input type="email" id="adminEmail" class="form-control" value="priya@gmail.com" required />
        </div>
        <button type="submit" class="btn btn-primary">Save Profile</button>
      </form>
    </section>

    <!-- Reset Dashboard Data -->
    <section class="mb-4">
      <h4>Reset Dashboard Data</h4>
      <button class="btn btn-delete me-2" onclick="clearData('pgs')">Clear PGs</button>
      <button class="btn btn-delete me-2" onclick="clearData('bookings')">Clear Bookings</button>
      <button class="btn btn-delete" onclick="clearData('users')">Clear Users</button>
    </section>

    <a href="admin_dashboard.html" class="btn btn-success w-100 mt-3">Go to Dashboard</a>

  </main>

  <script>
    // Dark mode toggle (visual only)
    document.getElementById('darkModeToggle').addEventListener('change', function () {
      document.body.classList.toggle('bg-dark');
      document.body.classList.toggle('text-light');
    });

    // Save profile
    document.getElementById('profileForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('adminName').value;
      const email = document.getElementById('adminEmail').value;
      alert(`✅ Profile saved:\nName: ${name}\nEmail: ${email}`);
    });

    // Clear data
    function clearData(type) {
      if (confirm(`Are you sure you want to clear all ${type}?`)) {
        localStorage.removeItem(type);
        alert(`✅ ${type.charAt(0).toUpperCase() + type.slice(1)} cleared successfully.`);
      }
    }
  </script>
</body>
</html>
