<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - FindMyPG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            height: 50px;
            width: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            background: #f8f9fa;
            color: #333;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            border: 2px solid #e0e0e0;
        }

        .back-btn:hover {
            background: #e9ecef;
            transform: translateX(-3px);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem 2rem;
        }

        .page-header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: slideDown 0.5s ease;
        }

        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .page-header p {
            font-size: 1.1rem;
            color: #666;
        }

        .debug-info {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .debug-info h4 {
            color: #856404;
            margin-bottom: 0.5rem;
        }

        .filter-tabs {
            background: white;
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 0.8rem 1.5rem;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .bookings-grid {
            display: grid;
            gap: 1.5rem;
        }

        .booking-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
        }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .booking-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .booking-header h3 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .booking-id {
            font-size: 0.9rem;
            opacity: 0.9;
            font-weight: normal;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge.confirmed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-badge.cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .booking-body {
            padding: 2rem;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-item {
            display: flex;
            align-items: start;
            gap: 1rem;
        }

        .detail-icon {
            width: 45px;
            height: 45px;
            background: #f0f4ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .detail-content h4 {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-content p {
            font-size: 1rem;
            color: #333;
            font-weight: 600;
        }

        .booking-amount {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .amount-label {
            font-size: 1rem;
            color: #666;
            font-weight: 600;
        }

        .amount-value {
            font-size: 2rem;
            color: #667eea;
            font-weight: bold;
        }

        .booking-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #fecaca;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .empty-state {
            background: white;
            border-radius: 20px;
            padding: 4rem 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .empty-state i {
            font-size: 5rem;
            color: #667eea;
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 1rem;
        }

        .empty-state p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .empty-state .action-btn {
            display: inline-flex;
        }

       
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem 1rem;
            }

            .page-header {
                padding: 1.5rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

            .booking-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .booking-amount {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-section">
                <div class="logo">FM</div>
                <div class="logo-text">FindMyPG</div>
            </div>
            <a href="user_dashboard.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>
                <i class="fa-solid fa-calendar-days"></i>
                <span id="userName">User</span>'s Bookings
            </h1>
            <p>View and manage all your PG bookings</p>
        </div>

        <!-- Debug info (remove after fixing) -->
        <div class="debug-info" id="debugInfo" style="display: none;">
            <h4>Debug Information:</h4>
            <p id="debugContent"></p>
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterBookings('all')">
                <i class="fa-solid fa-list"></i>
                All Bookings
            </button>
            <button class="tab-btn" onclick="filterBookings('confirmed')">
                <i class="fa-solid fa-circle-check"></i>
                Confirmed
            </button>
            <button class="tab-btn" onclick="filterBookings('pending')">
                <i class="fa-solid fa-clock"></i>
                Pending
            </button>
            <button class="tab-btn" onclick="filterBookings('cancelled')">
                <i class="fa-solid fa-circle-xmark"></i>
                Cancelled
            </button>
        </div>

        <div class="bookings-grid" id="bookingsContainer">
            <!-- Bookings will be loaded here -->
        </div>
    </div>

    
    <script>
        // Check if user is logged in
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (!currentUser || !currentUser.email) {
            alert("Please login first!");
            window.location.href = "login.html";
        }

        // Update user name
        document.getElementById('userName').textContent = currentUser.name || currentUser.email?.split('@')[0] || 'User';

        let allBookings = [];
        let currentFilter = 'all';

        // Helper function to get location string (supports multiple field names)
        function getLocationString(booking) {
            // Try different possible field names
            if (booking.pgLocation) return booking.pgLocation;
            if (booking.location) return booking.location;
            
            const parts = [];
            if (booking.pgAddress || booking.address) parts.push(booking.pgAddress || booking.address);
            if (booking.pgCity || booking.city) parts.push(booking.pgCity || booking.city);
            if (booking.area) parts.push(booking.area);
            
            return parts.length > 0 ? parts.join(', ') : 'Location not specified';
        }

        // Helper function to get PG name (supports multiple field names)
        function getPGName(booking) {
            return booking.pgName || booking.name || booking.propertyName || 'PG Booking';
        }

        // Helper function to get status
        function getStatus(booking) {
            // Check various status fields
            if (booking.paymentStatus) {
                if (booking.paymentStatus.toLowerCase() === 'success') return 'confirmed';
                if (booking.paymentStatus.toLowerCase() === 'cancelled') return 'cancelled';
                return booking.paymentStatus.toLowerCase();
            }
            if (booking.status) return booking.status.toLowerCase();
            return 'pending';
        }

        // Helper function to get amount
        function getAmount(booking) {
            return parseInt(booking.totalAmount || booking.amount || booking.rent || booking.price || 0);
        }

        // Load bookings from localStorage
        function loadBookings() {
            // Get all bookings from different possible storage keys
            const userBookings = JSON.parse(localStorage.getItem('userBookings') || '[]');
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const myBookings = JSON.parse(localStorage.getItem('myBookings') || '[]');
            
            // Combine all bookings
            allBookings = [...userBookings, ...bookings, ...myBookings];
            
            // Remove duplicates based on payment ID or booking ID
            const seen = new Set();
            allBookings = allBookings.filter(booking => {
                const id = booking.paymentId || booking.bookingId || booking.id || JSON.stringify(booking);
                if (seen.has(id)) return false;
                seen.add(id);
                return true;
            });
            
            // Filter bookings for current user (check multiple email fields)
            allBookings = allBookings.filter(booking => 
                booking.email === currentUser.email || 
                booking.userEmail === currentUser.email ||
                booking.user === currentUser.email ||
                booking.userId === currentUser.id ||
                booking.userId === currentUser.email
            );

            // Debug: Show what we found
            console.log('Current User:', currentUser);
            console.log('All Bookings Found:', allBookings);
            
            if (allBookings.length === 0) {
                // Show debug info if no bookings found
                const debugDiv = document.getElementById('debugInfo');
                const debugContent = document.getElementById('debugContent');
                debugDiv.style.display = 'block';
                debugContent.innerHTML = `
                    <strong>No bookings found for user: ${currentUser.email}</strong><br>
                    Total bookings in userBookings: ${userBookings.length}<br>
                    Total bookings in bookings: ${bookings.length}<br>
                    Total bookings in myBookings: ${myBookings.length}<br>
                    <button onclick="showAllData()" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">
                        Show All Storage Data
                    </button>
                `;
            }

            // Sort by date (newest first)
            allBookings.sort((a, b) => {
                const dateA = new Date(a.paymentDate || a.bookingDate || a.date || 0);
                const dateB = new Date(b.paymentDate || b.bookingDate || b.date || 0);
                return dateB - dateA;
            });

            displayBookings();
        }

        // Debug function to show all localStorage data
        function showAllData() {
            console.log('=== ALL LOCALSTORAGE DATA ===');
            console.log('userBookings:', localStorage.getItem('userBookings'));
            console.log('bookings:', localStorage.getItem('bookings'));
            console.log('myBookings:', localStorage.getItem('myBookings'));
            console.log('currentUser:', localStorage.getItem('currentUser'));
            alert('Check the browser console (F12) to see all localStorage data');
        }

        // Display bookings based on filter
        function displayBookings() {
            const container = document.getElementById('bookingsContainer');
            
            let filteredBookings = allBookings;
            if (currentFilter !== 'all') {
                filteredBookings = allBookings.filter(b => getStatus(b) === currentFilter);
            }

            if (filteredBookings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-calendar-xmark"></i>
                        <h3>No Bookings Found</h3>
                        <p>You don't have any ${currentFilter === 'all' ? '' : currentFilter} bookings yet.</p>
                        <a href="search.html" class="action-btn btn-primary">
                            <i class="fa-solid fa-search"></i>
                            Search for PGs
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredBookings.map((booking, index) => {
                const status = getStatus(booking);
                const statusDisplay = status.charAt(0).toUpperCase() + status.slice(1);
                const location = getLocationString(booking);
                const pgName = getPGName(booking);
                const amount = getAmount(booking);
                
                const bookingDate = new Date(booking.paymentDate || booking.bookingDate || booking.date || Date.now());
                const moveInDate = new Date(booking.moveInDate || booking.checkInDate || booking.startDate || Date.now());
                
                const bookingId = booking.paymentId || booking.bookingId || booking.id || `BK${Date.now().toString().slice(-8)}`;
                
                return `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div>
                                <h3>
                                    <i class="fa-solid fa-building"></i>
                                    ${pgName}
                                </h3>
                                <div class="booking-id">Booking ID: #${bookingId}</div>
                            </div>
                            <div class="status-badge ${status}">
                                <i class="fa-solid fa-${status === 'confirmed' ? 'circle-check' : status === 'pending' ? 'clock' : 'circle-xmark'}"></i>
                                ${statusDisplay}
                            </div>
                        </div>
                        <div class="booking-body">
                            <div class="booking-details">
                                <div class="detail-item">
                                    <div class="detail-icon">
                                        <i class="fa-solid fa-location-dot"></i>
                                    </div>
                                    <div class="detail-content">
                                        <h4>Location</h4>
                                        <p>${location}</p>
                                    </div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-icon">
                                        <i class="fa-solid fa-calendar"></i>
                                    </div>
                                    <div class="detail-content">
                                        <h4>Move-in Date</h4>
                                        <p>${moveInDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}</p>
                                    </div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-icon">
                                        <i class="fa-solid fa-bed"></i>
                                    </div>
                                    <div class="detail-content">
                                        <h4>Occupancy</h4>
                                        <p>${booking.occupancy || booking.roomType || booking.sharing || 'N/A'}</p>
                                    </div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-icon">
                                        <i class="fa-solid fa-clock"></i>
                                    </div>
                                    <div class="detail-content">
                                        <h4>Booked On</h4>
                                        <p>${bookingDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}</p>
                                    </div>
                                </div>
                            </div>
                            
                            ${booking.message ? `
                            <div style="background: #f0f4ff; padding: 1rem; border-radius: 10px; margin-top: 1rem;">
                                <strong style="color: #667eea; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                                    <i class="fa-solid fa-message"></i> Your Message
                                </strong>
                                <p style="color: #666;">${booking.message}</p>
                            </div>
                            ` : ''}

                            <div class="booking-amount">
                                <div>
                                    <div class="amount-label">Total Amount Paid</div>
                                    <div style="font-size: 0.85rem; color: #999; margin-top: 0.2rem;">
                                        ${booking.paymentId ? `Payment ID: ${booking.paymentId}` : 'Pending Payment'}
                                    </div>
                                </div>
                                <div class="amount-value">₹${amount.toLocaleString()}</div>
                            </div>

                            <div class="booking-actions">
                                <button class="action-btn btn-primary" onclick="viewDetails(${index})">
                                    <i class="fa-solid fa-eye"></i>
                                    View Details
                                </button>
                                ${status === 'pending' ? `
                                <button class="action-btn btn-danger" onclick="cancelBooking(${index})">
                                    <i class="fa-solid fa-xmark"></i>
                                    Cancel Booking
                                </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter bookings
        function filterBookings(filter) {
            currentFilter = filter;
            
            // Update active tab
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.tab-btn').classList.add('active');
            
            displayBookings();
        }

        // View booking details
        function viewDetails(index) {
            const bookings = currentFilter === 'all' ? 
                allBookings : 
                allBookings.filter(b => getStatus(b) === currentFilter);
            const booking = bookings[index];
            
            alert(`Booking Details:\n\n` +
                  `PG Name: ${getPGName(booking)}\n` +
                  `Location: ${getLocationString(booking)}\n` +
                  `Move-in Date: ${new Date(booking.moveInDate || booking.checkInDate || booking.startDate).toLocaleDateString('en-IN')}\n` +
                  `Occupancy: ${booking.occupancy || booking.roomType || 'N/A'}\n` +
                  `Amount: ₹${getAmount(booking).toLocaleString()}\n` +
                  `Status: ${getStatus(booking)}\n` +
                  `${booking.paymentId ? `Payment ID: ${booking.paymentId}\n` : ''}` +
                  `\nFor more details, please contact the PG owner.`);
        }

        // Cancel booking
        function cancelBooking(index) {
            if (confirm('Are you sure you want to cancel this booking?')) {
                const bookings = allBookings.filter(b => getStatus(b) === 'pending');
                const booking = bookings[index];
                
                // Find the booking in allBookings and update status
                const allBookingsIndex = allBookings.findIndex(b => 
                    (b.paymentId && b.paymentId === booking.paymentId) ||
                    (b.bookingId && b.bookingId === booking.bookingId) ||
                    (b.id && b.id === booking.id)
                );
                
                if (allBookingsIndex !== -1) {
                    allBookings[allBookingsIndex].status = 'cancelled';
                    allBookings[allBookingsIndex].paymentStatus = 'cancelled';
                    
                    // Update localStorage (check all possible storage keys)
                    ['userBookings', 'bookings', 'myBookings'].forEach(key => {
                        const allUserBookings = JSON.parse(localStorage.getItem(key) || '[]');
                        const globalIndex = allUserBookings.findIndex(b => 
                            (b.paymentId && b.paymentId === booking.paymentId) ||
                            (b.bookingId && b.bookingId === booking.bookingId) ||
                            (b.id && b.id === booking.id)
                        );
                        
                        if (globalIndex !== -1) {
                            allUserBookings[globalIndex].status = 'cancelled';
                            allUserBookings[globalIndex].paymentStatus = 'cancelled';
                            localStorage.setItem(key, JSON.stringify(allUserBookings));
                        }
                    });
                    
                    alert('Booking cancelled successfully!');
                    displayBookings();
                }
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadBookings();
            
            // Auto-hide debug info after 10 seconds if bookings are found
            setTimeout(() => {
                if (allBookings.length > 0) {
                    document.getElementById('debugInfo').style.display = 'none';
                }
            }, 10000);
        });
    </script>

    <div id="footer"></div>
<script>
  // Load the footer dynamically
  fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    })
    .catch(err => console.error("Error loading footer:", err));
</script>
</body>
</html>
