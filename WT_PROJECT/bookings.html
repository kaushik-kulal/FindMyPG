<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bookings - PG Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f6f9;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 5px;
    }
    .btn-delete:hover {
      background-color: #b02a37;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4">All Bookings</h2>

    <form id="bookingForm" class="mb-4">
      <div class="mb-2">
        <label for="pgName" class="form-label">PG Name</label>
        <input type="text" class="form-control" id="pgName" required />
      </div>
      <div class="mb-2">
        <label for="userName" class="form-label">User Name</label>
        <input type="text" class="form-control" id="userName" required />
      </div>
      <div class="mb-2">
        <label for="checkIn" class="form-label">Check-In Date</label>
        <input type="date" class="form-control" id="checkIn" required />
      </div>
      <div class="mb-2">
        <label for="checkOut" class="form-label">Check-Out Date</label>
        <input type="date" class="form-control" id="checkOut" required />
      </div>
      <button type="submit" class="btn btn-primary">Add Booking</button>
    </form>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>#</th>
          <th>PG Name</th>
          <th>User</th>
          <th>Check-In</th>
          <th>Check-Out</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="bookingTableBody">
        <tr><td colspan="6" class="text-muted text-center">No bookings yet.</td></tr>
      </tbody>
    </table>
<a href="admin_dashboard.html" class="btn btn-success w-100 mt-3">Go to Dashboard</a>
  </div>

  <script>
    function loadBookings() {
      const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
      const tableBody = document.getElementById('bookingTableBody');

      if (bookings.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" class="text-muted text-center">No bookings yet.</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      bookings.forEach((booking, index) => {
        const row = `
          <tr>
            <td>${index + 1}</td>
            <td>${booking.pgName}</td>
            <td>${booking.userName}</td>
            <td>${booking.checkIn}</td>
            <td>${booking.checkOut}</td>
            <td><button class="btn btn-delete btn-sm" onclick="deleteBooking(${index})">Delete</button></td>
          </tr>`;
        tableBody.innerHTML += row;
      });
    }

    function deleteBooking(index) {
      const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
      bookings.splice(index, 1);
      localStorage.setItem('bookings', JSON.stringify(bookings));
      loadBookings();
    }

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const pgName = document.getElementById('pgName').value.trim();
      const userName = document.getElementById('userName').value.trim();
      const checkIn = document.getElementById('checkIn').value;
      const checkOut = document.getElementById('checkOut').value;

      const newBooking = { pgName, userName, checkIn, checkOut };
      const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
      bookings.push(newBooking);
      localStorage.setItem('bookings', JSON.stringify(bookings));

      alert('✅ Booking added successfully!');
      this.reset();
      loadBookings();
    });

    window.onload = loadBookings;
  </script>
</body>
</html>
