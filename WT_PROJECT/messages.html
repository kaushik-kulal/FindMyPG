<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Messages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f6f9;
      color: #212529;
    }
    .card:hover {
      background-color: #f1f1f1;
    }
    .btn-delete {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 5px;
    }
    .btn-delete:hover {
      background-color: #b02a37;
    }
    label {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="container mt-5">
    <h2>Messages</h2>

    <form id="messageForm" class="mb-4" aria-label="Send a message">
      <div class="mb-3">
        <label for="sender" class="form-label">Sender Name</label>
        <input type="text" id="sender" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="subject" class="form-label">Subject</label>
        <input type="text" id="subject" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="body" class="form-label">Message Body</label>
        <textarea id="body" class="form-control" rows="4" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>

    <section id="messageList" aria-label="List of messages"></section>
<a href="admin_dashboard.html" class="btn btn-success w-100 mt-3">Go to Dashboard</a>
  </main>

  <script>
    function loadMessages() {
      const messages = JSON.parse(localStorage.getItem('messageList')) || [];
      const container = document.getElementById('messageList');

      if (messages.length === 0) {
        container.innerHTML = `<p class="text-muted">No messages yet.</p>`;
        return;
      }

      container.innerHTML = '';
      messages.forEach((msg, index) => {
        const card = document.createElement('div');
        card.className = 'card mb-3';
        card.setAttribute('role', 'article');
        card.innerHTML = `
          <div class="card-body">
            <h5 class="card-title">${msg.subject}</h5>
            <h6 class="card-subtitle mb-2 text-muted">From: ${msg.sender}</h6>
            <p class="card-text">${msg.body}</p>
            <button class="btn btn-sm btn-outline-primary me-2" onclick="viewMessage(${index})">View</button>
            <button class="btn btn-sm btn-delete" onclick="deleteMessage(${index})">Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function viewMessage(index) {
      const messages = JSON.parse(localStorage.getItem('messageList')) || [];
      const msg = messages[index];
      alert(`Subject: ${msg.subject}\nFrom: ${msg.sender}\n\n${msg.body}`);
    }

    function deleteMessage(index) {
      const messages = JSON.parse(localStorage.getItem('messageList')) || [];
      if (confirm(`Delete message from "${messages[index].sender}"?`)) {
        messages.splice(index, 1);
        localStorage.setItem('messageList', JSON.stringify(messages));
        loadMessages();
      }
    }

    document.getElementById('messageForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const sender = document.getElementById('sender').value.trim();
      const subject = document.getElementById('subject').value.trim();
      const body = document.getElementById('body').value.trim();

      if (!sender || !subject || !body) {
        alert('Please fill in all fields.');
        return;
      }

      const newMessage = { sender, subject, body };
      const messages = JSON.parse(localStorage.getItem('messageList')) || [];
      messages.push(newMessage);
      localStorage.setItem('messageList', JSON.stringify(messages));

      alert('✅ Message sent successfully!');
      this.reset();
      loadMessages();
    });

    window.onload = loadMessages;
  </script>
</body>
</html>
