<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; }
    .sidebar { height: 100vh; background-color: #1a1a2e; color: white; position: fixed; width: 240px; padding-top: 20px; }
    .sidebar a { display: block; color: #ccc; padding: 12px 20px; text-decoration: none; }
    .sidebar a:hover, .sidebar a.active { background-color: #16213e; color: #fff; }
    .main-content { margin-left: 240px; padding: 20px; }
    .btn-delete { background-color: #dc3545; color: white; border: none; border-radius: 5px; padding: 4px 10px; cursor: pointer; }
    .btn-delete:hover { background-color: #b02a37; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3 class="text-center">PG Admin</h3>
    <a href="index.html">Dashboard</a>
    <a href="manage_pg.html">Manage PGs</a>
    <a href="bookings.html">Bookings</a>
    <a href="users.html" class="active">Users</a>
    <a href="messages.html">Messages</a>
    <a href="settings.html">Settings</a>
    <a href="logout.html">Logout</a>
  </div>

  <div class="main-content">
    <h2>Users</h2>
    <p>Total Users: <strong id="totalUsers">0</strong></p>

    <form id="userForm" class="mb-4">
      <div class="row g-3">
        <div class="col-md-4">
          <input type="text" id="name" class="form-control" placeholder="Name" required>
        </div>
        <div class="col-md-4">
          <input type="email" id="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="col-md-4">
          <input type="text" id="phone" class="form-control" placeholder="Phone" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Add User</button>
    </form>

    <table class="table table-striped mt-3">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr><td colspan="5" class="text-center text-muted">No users found.</td></tr>
      </tbody>
    </table>
<a href="index.html" class="btn btn-success w-100 mt-3">Go to Dashboard</a>
  </div>

  <script>
    function loadUsers() {
      const users = JSON.parse(localStorage.getItem('userList')) || [];
      const totalUsers = document.getElementById('totalUsers');
      const tableBody = document.getElementById('userTableBody');
      totalUsers.textContent = users.length;

      if (users.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No users found.</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      users.forEach((user, index) => {
        const row = `
          <tr>
            <td>${index + 1}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.phone}</td>
            <td><button class="btn-delete" onclick="deleteUser(${index})">Delete</button></td>
          </tr>`;
        tableBody.innerHTML += row;
      });
    }

    function deleteUser(index) {
      const users = JSON.parse(localStorage.getItem('userList')) || [];
      if (confirm(`Delete user "${users[index].name}"?`)) {
        users.splice(index, 1);
        localStorage.setItem('userList', JSON.stringify(users));
        loadUsers();
      }
    }

    document.getElementById('userForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!name || !email || !phone) return;

      const newUser = { name, email, phone };
      const users = JSON.parse(localStorage.getItem('userList')) || [];
      users.push(newUser);
      localStorage.setItem('userList', JSON.stringify(users));

      this.reset();
      loadUsers();
    });

    window.onload = loadUsers;
  </script>
</body>
</html>
