<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New PG - FindMyPG</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding-bottom: 2rem;
    }

    header {
      background: rgba(255, 255, 255, 0.98);
      padding: 1.5rem 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-section { display: flex; align-items: center; gap: 1rem; }

    .logo {
      height: 50px; width: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px; color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.5rem;
    }

    .logo-text {
      font-size: 1.5rem; font-weight: bold;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-clip: text;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .back-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 0.7rem 1.5rem;
      border-radius: 10px; text-decoration: none; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(102,126,234,0.3);
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    }

    .back-btn:focus {
      outline: 2px solid #000;
      outline-offset: 2px;
    }

    .container { max-width: 800px; margin: 2rem auto; padding: 0 2rem; }
    
    .form-card {
      background: white; border-radius: 20px; padding: 2.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .form-card h1 {
      font-size: 2rem; margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-clip: text;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .form-card > p { color: #666; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1.5rem; }
    
    .form-group label { 
      display: block; margin-bottom: 0.5rem; color: #333; font-weight: 600; 
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.9rem; border: 2px solid #e9ecef; border-radius: 10px;
      font-size: 1rem; transition: all 0.3s ease; font-family: inherit;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: 2px solid #667eea;
      outline-offset: 2px;
      border-color: #667eea;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    
    .checkbox-group { 
      display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem; 
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-weight: normal;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"]:focus {
      outline: 2px solid #667eea;
      outline-offset: 2px;
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 1rem 2rem; border: none; border-radius: 10px;
      font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%;
      box-shadow: 0 4px 15px rgba(102,126,234,0.3);
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    }

    .submit-btn:focus {
      outline: 2px solid #000;
      outline-offset: 2px;
    }

    .success-message {
      display: none; background: #10b981; color: white;
      padding: 1rem; border-radius: 10px; margin-bottom: 1rem; text-align: center;
      font-weight: 600;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border-width: 0;
    }

    footer {
      background: rgba(255,255,255,0.1);
      color: white; text-align: center; padding: 1.5rem; margin-top: 4rem;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 0 1rem;
      }

      .form-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-section">
        <div class="logo" role="img" aria-label="FindMyPG Logo">FM</div>
        <div class="logo-text">FindMyPG</div>
      </div>
      <a href="owner_dashboard.html" class="back-btn" aria-label="Go back to owner dashboard">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> 
        <span>Back</span>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="form-card">
      <h1>
        <i class="fa-solid fa-plus-circle" aria-hidden="true"></i> 
        Add New PG
      </h1>
      <p>Fill in the details to list your PG accommodation</p>

      <div id="successMessage" class="success-message" role="status" aria-live="polite">
        <i class="fa-solid fa-check-circle" aria-hidden="true"></i> 
        PG added successfully!
      </div>

      <form id="addPgForm" novalidate>
        <div class="form-group">
          <label for="pgName">
            <i class="fa-solid fa-building" aria-hidden="true"></i> 
            PG Name <span aria-label="required">*</span>
          </label>
          <input type="text" id="pgName" name="pgName" required aria-required="true">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="roomType">
              <i class="fa-solid fa-home" aria-hidden="true"></i> 
              Room Type <span aria-label="required">*</span>
            </label>
            <select id="roomType" name="roomType" required aria-required="true">
              <option value="">Select room type</option>
              <option value="Single Room">Single Room</option>
              <option value="Double Sharing">Double Sharing</option>
              <option value="Triple Sharing">Triple Sharing</option>
              <option value="Four Sharing">Four Sharing</option>
            </select>
          </div>

          <div class="form-group">
            <label for="rent">
              <i class="fa-solid fa-indian-rupee-sign" aria-hidden="true"></i> 
              Monthly Rent <span aria-label="required">*</span>
            </label>
            <input type="number" id="rent" name="rent" required aria-required="true" min="0" step="1">
          </div>
        </div>

        <div class="form-group">
          <label for="location">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i> 
            Location <span aria-label="required">*</span>
          </label>
          <input type="text" id="location" name="location" required aria-required="true" placeholder="Enter location (e.g., Connaught Place, New Delhi)">
        </div>

        <div class="form-group">
          <label for="gender">
            <i class="fa-solid fa-users" aria-hidden="true"></i> 
            Gender Preference <span aria-label="required">*</span>
          </label>
          <select id="gender" name="gender" required aria-required="true">
            <option value="">Select gender preference</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Co-living">Co-living</option>
          </select>
        </div>

        <fieldset class="form-group">
          <legend>
            <i class="fa-solid fa-images" aria-hidden="true"></i> 
            Upload PG Images (3 max)
          </legend>
          <div class="form-row">
            <div>
              <label for="image1" class="sr-only">Upload first image</label>
              <input type="file" id="image1" name="image1" accept="image/*" aria-label="Upload first PG image">
            </div>
            <div>
              <label for="image2" class="sr-only">Upload second image</label>
              <input type="file" id="image2" name="image2" accept="image/*" aria-label="Upload second PG image">
            </div>
            <div>
              <label for="image3" class="sr-only">Upload third image</label>
              <input type="file" id="image3" name="image3" accept="image/*" aria-label="Upload third PG image">
            </div>
          </div>
        </fieldset>

        <fieldset class="form-group">
          <legend>
            <i class="fa-solid fa-check-circle" aria-hidden="true"></i> 
            Amenities
          </legend>
          <div class="checkbox-group">
            <label>
              <input type="checkbox" name="amenities" value="WiFi" id="amenity-wifi">
              <span>WiFi</span>
            </label>
            <label>
              <input type="checkbox" name="amenities" value="AC" id="amenity-ac">
              <span>AC</span>
            </label>
            <label>
              <input type="checkbox" name="amenities" value="Meals" id="amenity-meals">
              <span>Meals</span>
            </label>
            <label>
              <input type="checkbox" name="amenities" value="Laundry" id="amenity-laundry">
              <span>Laundry</span>
            </label>
            <label>
              <input type="checkbox" name="amenities" value="Parking" id="amenity-parking">
              <span>Parking</span>
            </label>
            <label>
              <input type="checkbox" name="amenities" value="TV" id="amenity-tv">
              <span>TV</span>
            </label>
          </div>
        </fieldset>

        <div class="form-group">
          <label for="description">
            <i class="fa-solid fa-info-circle" aria-hidden="true"></i> 
            Description
          </label>
          <textarea id="description" name="description" placeholder="Enter additional details about your PG..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="contact">
              <i class="fa-solid fa-phone" aria-hidden="true"></i> 
              Contact Number <span aria-label="required">*</span>
            </label>
            <input type="tel" id="contact" name="contact" required aria-required="true">
          </div>

          <div class="form-group">
            <label for="email">
              <i class="fa-solid fa-envelope" aria-hidden="true"></i> 
              Email
            </label>
            <input type="email" id="email" name="email">
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fa-solid fa-plus-circle" aria-hidden="true"></i> 
          Add PG Listing
        </button>
      </form>
    </div>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("addPgForm");
    const successMsg = document.getElementById("successMessage");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      // Collect values
      const pgData = {
        name: document.getElementById("pgName").value,
        roomType: document.getElementById("roomType").value,
        rent: document.getElementById("rent").value,
        location: document.getElementById("location").value,
        gender: document.getElementById("gender").value,
        description: document.getElementById("description").value,
        contact: document.getElementById("contact").value,
        email: document.getElementById("email").value,
        amenities: [],
        images: []
      };

      // Amenities
      document.querySelectorAll(".checkbox-group input:checked").forEach(cb => {
        pgData.amenities.push(cb.value);
      });

      // Images
      const files = [
        document.getElementById("image1").files[0],
        document.getElementById("image2").files[0],
        document.getElementById("image3").files[0]
      ];
      for (const file of files) {
        if (file) {
          const reader = new FileReader();
          const base64 = await new Promise(res => {
            reader.onload = () => res(reader.result);
            reader.readAsDataURL(file);
          });
          pgData.images.push(base64);
        }
      }

      // Save locally
      const saved = JSON.parse(localStorage.getItem("pgListings") || "[]");
      saved.push(pgData);
      localStorage.setItem("pgListings", JSON.stringify(saved));

      // Show success
      successMsg.style.display = "block";
      setTimeout(() => (successMsg.style.display = "none"), 3000);
      alert("PG added successfully!");
      form.reset();
      console.log("✅ Saved:", pgData);
    });
  });
  </script>
</body>
</html>
